[workspace]
resolver = "2"
members = [
    "core/manager",
    "core/downloader",
    "core/config",
    "core/launcher",
    "apps/desktop",
    "apps/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["OpenTTD Manager Plus Contributors"]
description = "A cross-platform OpenTTD version manager and launcher"

[workspace.dependencies]
# Dioxus 0.7 — cross-platform UI framework
dioxus = { version = "0.7", default-features = false }
dioxus-desktop = "0.7"
dioxus-native = "0.7"
dioxus-logger = "0.7"
dioxus-hooks = "0.7"
dioxus-router = "0.7"
dioxus-signals = "0.7"
dioxus-html = "0.7"
manganis = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / Networking
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Archive handling
zip = "2"
tar = "0.4"
flate2 = "1"

# Versioning
semver = { version = "1", features = ["serde"] }

# Hashing
sha2 = "0.10"

# Progress
indicatif = "0.17"

# Concurrency
parking_lot = "0.12"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }