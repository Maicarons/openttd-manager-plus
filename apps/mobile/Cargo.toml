[package]
name = "otmp-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenTTD Manager Plus Mobile Application (Android & iOS)"

[features]
default = ["mobile"]
mobile = []
web = []

[dependencies]
# Dioxus Native — Blitz/WGPU renderer (no WebView)
dioxus-native = { version = "0.7", features = ["prelude", "default"] }
dioxus-router = "0.7"
dioxus-logger = "0.7"
manganis = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
otmp-core-manager = { path = "../../core/manager" }
otmp-core-downloader = { path = "../../core/downloader" }
otmp-core-config = { path = "../../core/config" }
otmp-core-launcher = { path = "../../core/launcher" }